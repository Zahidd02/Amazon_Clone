<app-header></app-header>
<div class="home">
  <div class="home__container">
    <section class="home__feature" aria-label="Amazon Prime and LinkedIn feature">
      <div class="home__featureContent">
        <p class="home__featureEyebrow">Featured on LinkedIn</p>
        <h1>Check out this Amazon clone in action</h1>
        <p class="home__featureText">
          Explore my personal Amazon clone, built with Azure services and shared on LinkedIn.
        </p>
        <a
          class="home__linkedinLink"
          href="https://www.linkedin.com/feed/update/urn:li:ugcPost:7144410606110949376/"
          target="_blank"
          rel="noopener noreferrer">
          View the post on LinkedIn
        </a>
      </div>
      <div class="home__linkedinEmbed">
        <iframe
          src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7144410606110949376?compact=1"
          title="Embedded LinkedIn post"
          height="399"
          width="504"
          frameborder="0"
          allowfullscreen>
        </iframe>
        <a
          class="home__videoLink"
          href="https://www.linkedin.com/feed/update/urn:li:ugcPost:7144410606110949376/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Watch the LinkedIn post">
        </a>
      </div>
    </section>

    <div class="home__row">
      <app-product [productId]="2"></app-product>
      <app-product [productId]="4"></app-product>
      <app-product [productId]="1"></app-product>
    </div>

    <div class="home__row">
      <app-product [productId]="3"></app-product>
      <app-product [productId]="6"></app-product>
      <app-product [productId]="10"></app-product>
    </div>

    <div class="home__row">
      <app-product [productId]="5"></app-product>
      <app-product [productId]="7"></app-product>
      <app-product [productId]="8"></app-product>
    </div>

    <div class="home__row">
      <app-product [productId]="9"></app-product>
      <app-product [productId]="11"></app-product>
      <app-product [productId]="12"></app-product>
    </div>
  </div>
</div>
